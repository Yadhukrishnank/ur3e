moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - hand_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: joint_trajectory_controller/follow_joint_trajectory  # Correct action server
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  hand_controller:
    type: GripperCommand  # Use GripperCommand for the gripper action
    action_ns: gripper_action_controller/gripper_cmd  # Matches GripperActionController's action
    default: true
    parallel: true  # Allow parallel execution with arm
    joints:
      - robotiq_85_left_knuckle_joint